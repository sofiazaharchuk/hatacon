[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ecp-auth-hackathon"
version = "0.1.0"
description = "Django package for two-factor ECP authentication with certificate and signature validation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "PUB Hackathon Team" }
]
keywords = ["django", "ecp", "digital-signature", "x509", "2fa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]
dependencies = [
  "Django>=6.0",
  "cryptography>=42.0.0",
  "pycryptodome>=3.20.0",
  "asn1crypto>=1.5.1",
  "certvalidator>=0.11.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_ecp_auth*"]
