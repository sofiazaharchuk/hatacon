<!DOCTYPE html>
<html lang="uk" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація успішна</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-100 text-slate-900 antialiased md:h-screen md:overflow-hidden">
  <div class="min-h-screen pb-24 md:h-full md:pb-28">
  <main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-4 py-6 md:h-full md:py-10">
    <section class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl shadow-slate-300/60 sm:p-8">
      <h1 class="text-xl font-semibold sm:text-2xl">Реєстрацію завершено!</h1>
      <p class="mt-2 text-sm text-slate-600">
        Акаунт <span class="font-semibold text-slate-900">{{ email }}</span> створено успішно.
      </p>

      <div class="mt-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
        Збережіть приватний ключ зараз — він доступний для завантаження лише один раз (протягом ~10 хвилин).
      </div>

      <a
        href="{{ url('download-private-key') }}"
        class="mt-4 inline-flex w-full items-center justify-center rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-500"
      >
        Завантажити приватний ключ (.pem)
      </a>

      <a
        href="{{ url('login') }}"
        class="mt-3 inline-flex w-full items-center justify-center rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700"
      >
        Перейти до входу
      </a>
    </section>
  </main>
  </div>

  {% include 'partials/footer.html' %}
</body>
</html>
